backend:
  name: github
  repo: lordestar/lordestar-site
  branch: main
  base_url: https://lordestar.pages.dev/admin/oauth

local_backend: false

media_folder: public/uploads
public_folder: /uploads

i18n:
  structure: multiple_folders
  locales: [zh, en]
  default_locale: zh

collections:
  - name: works
    label: Works
    label_singular: Work
    folder: src/content/works
    create: true
    i18n: true
    slug: "{{slug}}"
    summary: "{{title}} · {{type}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Type, name: type, widget: select, options: [music, code] }
      - { label: Date, name: date, widget: datetime }
      - { label: Summary, name: summary, widget: text }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Cover image, name: cover, widget: image, required: false }
      - { label: Audio file, name: audio, widget: file, required: false, media_library: { config: { max_file_size: 31457280 } } }
      - { label: External link, name: link, widget: string, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: posts
    label: Thoughts
    label_singular: Thought
    folder: src/content/posts
    create: true
    i18n: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Summary, name: summary, widget: text }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Body, name: body, widget: markdown }
